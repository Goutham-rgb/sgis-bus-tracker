<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGIS Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Top Navigation Header -->
    <header class="bg-indigo-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Shree Swaminarayan Gurukul International School</h1>
                <p class="text-indigo-200 text-sm">Transport Admin Dashboard</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="/" class="text-sm bg-indigo-800 hover:bg-indigo-700 px-3 py-2 rounded-lg transition">← Bus Tracker Home</a>
                <a href="/logout" class="bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">Log out</a>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

        <!-- Buses Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">🚌 Buses</h2>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow-sm">+ Add bus</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4 font-semibold">Bus No</th>
                            <th class="py-3 px-4 font-semibold">Registration</th>
                            <th class="py-3 px-4 font-semibold">Driver</th>
                            <th class="py-3 px-4 font-semibold">Phone</th>
                            <th class="py-3 px-4 font-semibold">Capacity</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm text-slate-600"></tbody>
                </table>
            </div>
        </section>

        <!-- Admin Fleet Live Map Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">🟢 Fleet Live Tracking</h2>
                <span class="text-xs bg-indigo-100 text-indigo-700 font-medium px-3 py-1 rounded-full">All Buses Active</span>
            </div>
            <div id="admin-map" class="w-full h-96 rounded-xl border border-slate-200 z-10"></div>
        </section>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const adminMap = L.map('admin-map').setView([17.3850, 78.4867], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(adminMap);

        const buses = [
            { id: 'Bus #101', lat: 17.3850, lng: 78.4867, driver: 'Ramesh Kumar' },
            { id: 'Bus #102', lat: 17.3950, lng: 78.4767, driver: 'Suresh Patel' }
        ];

        buses.forEach(bus => {
            const icon = L.divIcon({
                html: '<div class="bg-indigo-600 text-white p-2 rounded-full shadow-lg flex items-center justify-center text-xs">🚌</div>',
                className: 'custom-bus-marker', iconSize: [36, 36], iconAnchor: [18, 18]
            });
            L.marker([bus.lat, bus.lng], { icon }).addTo(adminMap)
              .bindPopup(`<b>${bus.id}</b><br>Driver: ${bus.driver}<br>Status: On Route`);
        });
    </script>
</body>
</html>
